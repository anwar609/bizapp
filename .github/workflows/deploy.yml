name: Build and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'infra/scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ARTIFACT_BUCKET: bizapp-artifacts-673515369143
  TG_ARN: arn:aws:elasticloadbalancing:us-east-1:673515369143:targetgroup/bizapp-tg/d68a54ac1f5ad0f4
  SECRET_NAME: bizapp/db/credentials
  APP_PORT: 2330

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      jar_uri: ${{ steps.publish.outputs.jar_uri }}
      script_uri: ${{ steps.publish.outputs.script_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - id: meta
        run: echo "version=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: app
        run: mvn --batch-mode clean package -DskipTests

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: publish
        run: |
          V="${{ steps.meta.outputs.version }}"
          JAR="s3://${ARTIFACT_BUCKET}/builds/${V}/app.jar"
          SCRIPT="s3://${ARTIFACT_BUCKET}/builds/${V}/remote-deploy.sh"
          aws s3 cp app/target/BusinessProject-0.0.1-SNAPSHOT.jar "${JAR}"
          aws s3 cp infra/scripts/remote-deploy.sh "${SCRIPT}"
          echo "jar_uri=${JAR}" >> "$GITHUB_OUTPUT"
          echo "script_uri=${SCRIPT}" >> "$GITHUB_OUTPUT"

  group-a:
    name: Deploy group A
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          bash infra/scripts/deploy-wave.sh a "${{ needs.build.outputs.jar_uri }}" "${{ needs.build.outputs.script_uri }}" "${{ needs.build.outputs.version }}"

  approval:
    name: Approval gate
    needs: [build, group-a]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Group A serving ${{ needs.build.outputs.version }}"

  group-b:
    name: Deploy group B
    needs: [build, approval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          bash infra/scripts/deploy-wave.sh b "${{ needs.build.outputs.jar_uri }}" "${{ needs.build.outputs.script_uri }}" "${{ needs.build.outputs.version }}"
